name: Build deps image

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - Dockerfile.deps
      - .github/workflows/deps.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if an image for this hash already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deps:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      hash: ${{ steps.meta.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute deps hash
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name="${GITHUB_REPOSITORY#*/}"
          hash=$(cat package.json package-lock.json Dockerfile.deps | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner}/${name,,}-deps" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: exists
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hash }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Deps image for hash ${{ steps.meta.outputs.hash }} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists != 'true'

      - name: Build and push deps image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deps
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.hash }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=deps
          cache-to: type=gha,mode=max,scope=deps
